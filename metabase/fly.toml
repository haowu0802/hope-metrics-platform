app = "hope-metrics-metabase"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  MB_JETTY_PORT = "3000"
  MB_DB_FILE = "/metabase-data/metabase.db"

[mounts]
  source = "metabase_data"
  destination = "/metabase-data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
