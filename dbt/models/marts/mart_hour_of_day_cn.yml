version: 2

models:
  - name: mart_hour_of_day_cn
    description: Activity/resource averages by Asia/Shanghai hour-of-day (0–23).
    data_tests:
      - unique:
          column_name: hour_cn
    columns:
      - name: hour_cn
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
                inclusive: true
      - name: active_minutes_sum
        data_tests:
          - not_null
