version: 2

models:
  - name: stg_device_usage_hour
    description: Latest row per (device_id, window_start).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - device_id
              - window_start
    columns:
      - name: device_id
        data_tests:
          - not_null
      - name: window_start
        data_tests:
          - not_null
      - name: active_minutes
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: _loaded_at
        data_tests:
          - not_null
