version: 2

models:
  - name: mart_hour_of_day
    description: Active minutes and resource averages by US/Eastern hour-of-day (0–23).
    data_tests:
      - unique:
          column_name: hour_et
    columns:
      - name: hour_et
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
                inclusive: true
      - name: active_minutes_sum
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: device_count
        data_tests:
          - not_null
      - name: active_minutes_avg
        data_tests:
          - not_null
