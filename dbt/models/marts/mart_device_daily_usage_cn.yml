version: 2

models:
  - name: mart_device_daily_usage_cn
    description: Device × Asia/Shanghai day (demo / China stakeholder grain).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - device_id
              - usage_date
    columns:
      - name: device_id
        data_tests:
          - not_null
      - name: usage_date
        data_tests:
          - not_null
      - name: active_minutes_day
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
